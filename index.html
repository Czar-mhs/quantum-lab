<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMPHR - Building Compliance & Health Scoring</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>AMPHR</h1>
            <p>Building Health & Compliance Management</p>
            <button id="municipalityToggle" class="toggle-btn">Switch to ADM</button>
        </header>

        <main>
            <section class="dashboard">
                <h2 id="municipalityTitle">Dubai Municipality (DM Law 3/2026)</h2>
                
                <div class="input-section">
                    <h3>Building Information</h3>
                    <input type="text" id="buildingName" placeholder="Building Name" />
                    <input type="text" id="buildingLocation" placeholder="Location" />
                    <input type="number" id="buildingYear" placeholder="Year Built" />
                    <button onclick="resetInspection()">New Inspection</button>
                </div>

                <div class="scoring-section">
                    <h3 id="scoringTitle">Health Score Breakdown (DM)</h3>
                    <div id="scoreInputs" class="score-inputs"></div>
                    <div class="score-display">
                        <div id="healthScore" class="score-card">
                            <div class="score-number">0</div>
                            <div class="score-label">Health Score</div>
                        </div>
                        <div id="certificateStatus" class="status-card">
                            <div class="status-text">No Data</div>
                        </div>
                    </div>
                </div>

                <div class="inspection-section">
                    <h3 id="inspectionTitle">Inspection Items (DM)</h3>
                    <div id="inspectionItems" class="inspection-grid"></div>
                </div>

                <div class="action-section">
                    <button onclick="generatePDF()" class="btn-primary">Generate Certificate PDF</button>
                    <button onclick="exportData()" class="btn-secondary">Export Data</button>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
    <script src="adm.js"></script>
    <script src="toggle.js"></script>
    <script src="pdf-gen.js"></script>
</body>
</html>
